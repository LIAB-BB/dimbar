name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh --dist

      - name: Smoke test
        run: build/DimBar.app/Contents/MacOS/DimBar --help | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: DimBar
          path: build/DimBar-*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DimBar-*.zip
